<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#044e42"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Inner Soft Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Mosque Dome & Minaret Silhouette Motif -->
  <g filter="url(#glow)">
    <!-- Elegant Crescent Moon (Hilal) -->
    <path d="M37 11 C33 11 29 13.5 27.5 17.5 C26 21.5 27.2 26 30.5 28.5 C25 28 20.5 23 21 17.5 C17.5 21 16 26.5 17.5 31.5 C19.5 38 25.5 42.5 32.5 42 C38.5 41.5 43.5 37 45 31.5 C46 27.5 44.5 23.5 42 20.5 C40.5 23 37.5 24.5 34.5 24 C31.5 23.5 29.5 21 29.5 18 C29.5 15 32 12.2 35.5 11.8 C36 11.3 36.5 11.1 37 11 Z" fill="url(#goldGrad)"/>

    <!-- Radiant 8-pointed Islamic Star -->
    <path d="M43 14.5 L44.2 16.8 L46.7 17.2 L44.8 18.9 L45.3 21.4 L43 20.1 L40.7 21.4 L41.2 18.9 L39.3 17.2 L41.8 16.8 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Mosque Arch & Mihrab Base -->
    <path d="M22 51 L22 41 C22 35 26 31 32 29 C38 31 42 35 42 41 L42 51 Z" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M25 51 L25 42 C25 38 28 34.5 32 33 C36 34.5 39 38 39 42 L39 51 Z" fill="#ffffff" fill-opacity="0.35"/>
    <path d="M28 51 L28 44 C28 41 29.8 38.5 32 37.5 C34.2 38.5 36 41 36 44 L36 51 Z" fill="url(#goldGrad)"/>

    <!-- Minaret Finial Pinnacle -->
    <circle cx="32" cy="27" r="2" fill="url(#goldGrad)"/>
    <line x1="32" y1="27" x2="32" y2="30" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Base Baseline Ground Accent -->
  <line x1="16" y1="51" x2="48" y2="51" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
